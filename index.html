<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roam · Luxe Sailing</title>
<style>
  :root{
    --navy:#15244e;--navy2:#0d1838;--ink:#0a1230;--gold:#c4a875;--gold-deep:#a98a52;
    --ivory:#f4f1ea;--ivory-dim:#aab2cc;--line:rgba(196,168,117,.24);
    --sea1:#22386f;--sea2:#0b1430;--land:#d8c8a2;--coast:#9a824f;--route:#c4a875;--ivory-v:#f4f1ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Helvetica Neue',Arial,sans-serif;color:var(--ivory);background:var(--ink);overflow:hidden}
  .serif{font-family:Georgia,'Times New Roman',serif}
  #app{display:flex;height:100vh;width:100vw}
  #mapwrap{flex:1;position:relative;background:var(--ink);overflow:hidden}
  #map{width:100%;height:100%;display:block}
  .lbl{font-family:Georgia,serif;font-size:13px;fill:var(--ivory);paint-order:stroke;stroke:rgba(6,12,28,.92);stroke-width:3.5px}
  .region{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:.32em;fill:var(--coast);opacity:.9;text-transform:uppercase}
  .sea{font-family:Georgia,serif;font-style:italic;font-size:14px;letter-spacing:.2em;fill:var(--route);opacity:.34}
  #here{position:absolute;left:13px;bottom:13px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ivory-dim);background:rgba(10,18,48,.62);padding:6px 11px;border:1px solid var(--line);border-radius:8px;opacity:0;transition:.4s;max-width:72%}
  #here.show{opacity:1}

  #panel{width:330px;background:linear-gradient(180deg,var(--navy),var(--navy2));border-left:1px solid var(--line);display:flex;flex-direction:column;height:100vh}

  /* consolidated tour header */
  .tourhead{padding:13px 20px 12px;border-bottom:1px solid var(--line)}
  .th-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .brandk{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
  .brandk i{opacity:.5;font-style:normal;margin:0 3px}
  .syn{font-size:9px;letter-spacing:.12em;color:#7fd6a0;text-transform:uppercase;display:flex;align-items:center;gap:5px}
  .syn::before{content:'';width:6px;height:6px;border-radius:50%;background:#7fd6a0;box-shadow:0 0 8px #7fd6a0}
  .syn.hide{display:none}
  .th-title{font-family:Georgia,serif;font-size:25px;line-height:1.05}
  .th-meta{font-size:11.5px;color:var(--ivory-dim);letter-spacing:.02em;margin-top:4px}

  /* slim status strip */
  #live{padding:9px 20px;border-bottom:1px solid var(--line);background:rgba(196,168,117,.05)}
  #live .r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  #live .name{font-family:Georgia,serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #live .dist{font-family:Georgia,serif;font-size:14px;color:var(--ivory);white-space:nowrap}
  #live .dist b{color:var(--gold);font-weight:600}
  #bar{height:3px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
  #barfill{height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .14s linear}

  .scroll{flex:1;overflow-y:auto;padding:12px 18px}
  .scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  .sec-label{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:2px 0 9px;display:flex;justify-content:space-between}
  .sec-label .tot{color:var(--ivory-dim)}
  .stops{list-style:none;display:flex;flex-direction:column;position:relative}
  .stop{display:flex;gap:12px;padding:5px 3px;border-radius:8px;transition:.25s}
  .stop.active{background:rgba(196,168,117,.12)}
  .stop.done .num{background:var(--gold);color:var(--navy);border-color:var(--gold)}
  .stop .rail{display:flex;flex-direction:column;align-items:center}
  .stop .num{width:22px;height:22px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-size:11px;display:grid;place-items:center;flex:none;transition:.25s}
  .stop .conn{width:1px;flex:1;min-height:8px;background:var(--line);margin:2px 0}
  .stop:last-child .conn{display:none}
  .stop .body{padding-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;flex:1;gap:8px}
  .stop .nm{font-size:14.5px}
  .stop .sub{font-size:10.5px;color:var(--ivory-dim);letter-spacing:.02em;text-align:right;white-space:nowrap}
  .stop .sub b{color:var(--gold)}

  .controls{padding:12px 18px;border-top:1px solid var(--line);background:rgba(10,18,48,.5)}
  button{font-family:'Helvetica Neue',Arial,sans-serif;cursor:pointer;border:none;letter-spacing:.06em;transition:.2s}
  .play{width:100%;background:linear-gradient(135deg,var(--gold-deep),var(--gold));color:var(--navy);font-weight:600;padding:12px;border-radius:10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.16em}
  .play:hover{filter:brightness(1.06)}
  .rowflex{display:flex;gap:8px;margin-top:10px}
  .btn-ghost{flex:1;background:transparent;border:1px solid var(--line);color:var(--ivory);padding:9px;border-radius:9px;font-size:10px;text-transform:uppercase}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
  .sub-controls{display:flex;align-items:center;gap:12px;margin-top:10px}
  .sub-controls .lab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ivory-dim)}
  input[type=range]{-webkit-appearance:none;flex:1;height:3px;background:var(--line);border-radius:3px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);cursor:pointer}
  .styletog{display:flex;gap:6px;margin-top:9px}
  .styletog button{flex:1;background:transparent;border:1px solid var(--line);color:var(--ivory-dim);padding:7px;border-radius:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .styletog button.on{border-color:var(--gold);color:var(--gold);background:rgba(196,168,117,.1)}
  .opttoggle{display:none}
  .opts{display:block}
  .ctop{display:flex;gap:8px;align-items:stretch}
  .play{flex:1}
  .syn{display:none}

  @media(max-width:760px){
    html,body{height:auto;overflow-y:auto;overflow-x:hidden}
    #app{flex-direction:column;height:auto;min-height:100vh}
    #mapwrap{height:42vh;min-height:250px;flex:none}
    #panel{width:100%;height:auto;border-left:none;border-top:1px solid var(--line);display:flex;flex-direction:column}
    .tourhead{order:0;padding:10px 16px 9px}.th-title{font-size:20px}
    #live{order:1;padding:8px 16px}
    .controls{order:2;border-top:none;border-bottom:1px solid var(--line);padding:9px 16px}
    .play{padding:10px;font-size:11.5px}
    .opttoggle{display:block;flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--ivory-dim);
      padding:10px 13px;border-radius:9px;font-size:9.5px;text-transform:uppercase;letter-spacing:.14em}
    .opts{display:none;margin-top:9px}.opts.open{display:block}
    .rowflex{margin-top:0}
    .scroll{order:3;overflow:visible;flex:none;padding-top:9px;padding-bottom:30px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap"><svg id="map" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid slice"></svg><div id="here">—</div></div>
  <aside id="panel">
    <div class="tourhead">
      <div class="th-top"><span class="brandk">Roam <i>·</i> Luxe Sailing</span><span class="syn" id="syn">TMS · synced</span></div>
      <div class="th-title serif" id="tTitle">—</div>
      <div class="th-meta" id="tMeta">—</div>
    </div>
    <div id="live">
      <div class="r1"><span class="name serif" id="lName">—</span><span class="dist" id="lDist">—</span></div>
      <div id="bar"><div id="barfill"></div></div>
    </div>
    <div class="scroll">
      <div class="sec-label"><span>Itinerary</span><span class="tot" id="count">—</span></div>
      <ul class="stops" id="stopList"></ul>
    </div>
    <div class="controls">
      <div class="ctop"><button class="play" id="playBtn">&#9654; Play</button><button class="opttoggle" id="optToggle">Options</button></div>
      <div class="opts" id="opts">
        <div class="rowflex"><button class="btn-ghost" id="loadTms">Sailing tour</button><button class="btn-ghost" id="loadSample">Land tour</button></div>
        <div class="sub-controls"><span class="lab">Speed</span><input type="range" id="speed" min="0.5" max="2.5" step="0.1" value="0.5"></div>
        <div class="styletog"><button id="s0" class="on">Navy</button><button id="s1">Night</button><button id="s2">Ivory</button></div>
      </div>
    </div>
  </aside>
</div>

    {code:"",destination:'Nafplio',lat:37.5675,lng:22.8000,nights:1},
    {code:"",destination:'Sparta',lat:37.0739,lng:22.4297,nights:1},
    {code:"",destination:'Monemvasia',lat:36.6877,lng:23.0530,nights:2}]};

let stops=[],pts=[],legB=[],legD=[],cumD=[],totalD=0,B=null,projP=[],theme=0,U='NM',MODE='sea';
let phase='idle',animI=0,animCursor=1,raf=null,leadT=null;
let cam={x:0,y:0,w:W,h:H},camT={x:0,y:0,w:W,h:H};
const fmtRange=(a,b)=>{const o={day:'numeric',month:'short'};return new Date(a).toLocaleDateString('en-AU',o)+' – '+new Date(b).toLocaleDateString('en-AU',o);};
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
function havKm(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLn=(b.lng-a.lng)*r;
  const s=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLn/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function dist(a,b){const km=havKm(a,b);return U==='NM'?km/1.852:km;}
function bounds(){const la=stops.map(s=>s.lat),ln=stops.map(s=>s.lng);
  let mLa=Math.min(...la),xLa=Math.max(...la),mLn=Math.min(...ln),xLn=Math.max(...ln);
  let py=(xLa-mLa)*0.55||0.4,px=(xLn-mLn)*0.55||0.4;mLa-=py;xLa+=py;mLn-=px;xLn+=px;
  const cosL=Math.cos((mLa+xLa)/2*Math.PI/180),spanLng=xLn-mLn,spanLat=xLa-mLa,need=spanLat*AR*cosL;
  if(need>spanLng){const d=(need-spanLng)/2;mLn-=d;xLn+=d;}else{const d=(spanLng/(AR*cosL)-spanLat)/2;mLa-=d;xLa+=d;}
  return {minLat:mLa,maxLat:xLa,minLng:mLn,maxLng:xLn};}
const project=(lat,lng)=>[PAD+(lng-B.minLng)/(B.maxLng-B.minLng)*(W-2*PAD),PAD+(B.maxLat-lat)/(B.maxLat-B.minLat)*(H-2*PAD)];
function curve(a,p,n){const mx=(a[0]+p[0])/2,my=(a[1]+p[1])/2,dx=p[0]-a[0],dy=p[1]-a[1],cx=mx+dy*0.15,cy=my-dx*0.15,o=[];
  for(let t=0;t<=n;t++){const u=t/n,k=1-u;o.push([k*k*a[0]+2*k*u*cx+u*u*p[0],k*k*a[1]+2*k*u*cy+u*u*p[1]]);}return o;}
const LANDREF=(typeof LAND!=='undefined')?LAND:[];
let trailGlow,trailEl,boatEl;
function draw(){const T=THEMES[theme];for(const k in T)document.documentElement.style.setProperty('--'+k,T[k]);
  B=bounds();projP=stops.map(s=>project(s.lat,s.lng));svg.innerHTML='';
  const defs=el('defs',{});
  defs.innerHTML=`<radialGradient id="sea" cx="50%" cy="42%" r="80%"><stop offset="0%" stop-color="${T.sea1}"/><stop offset="100%" stop-color="${T.sea2}"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>`;
  svg.appendChild(defs);svg.appendChild(el('rect',{x:-300,y:-300,width:W+600,height:H+600,fill:'url(#sea)'}));
  for(let i=1;i<10;i++){svg.appendChild(el('line',{x1:i*W/10,y1:-200,x2:i*W/10,y2:H+200,stroke:T.route,'stroke-opacity':.045}));
    svg.appendChild(el('line',{x1:-200,y1:i*H/10,x2:W+200,y2:i*H/10,stroke:T.route,'stroke-opacity':.045}));}
  LANDREF.forEach(r=>{const d=r.map(c=>project(c[1],c[0]).join(',')).join(' ');
    svg.appendChild(el('polygon',{points:d,fill:T.land,stroke:T.coast,'stroke-width':1,'stroke-linejoin':'round'}));});
  REGIONS.forEach(g=>{const p=project(g.lat,g.lng),t=el('text',{x:p[0],y:p[1],'text-anchor':'middle'});t.setAttribute('class',g.c);t.textContent=g.t;svg.appendChild(t);});
  pts=[];legB=[0];legD=[];cumD=[0];totalD=0;
  for(let i=0;i<projP.length-1;i++){const seg=curve(projP[i],projP[i+1],64);pts=pts.concat(i?seg.slice(1):seg);legB.push(pts.length-1);
    const d=dist(stops[i],stops[i+1]);legD.push(d);totalD+=d;cumD.push(totalD);}
  svg.appendChild(el('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:T.route,'stroke-opacity':.22,'stroke-width':1.8,'stroke-dasharray':'1 7','stroke-linecap':'round'}));
  trailGlow=el('polyline',{points:'',fill:'none',stroke:T.route,'stroke-width':7,'stroke-opacity':.3,'stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#glow)'});
  trailEl=el('polyline',{points:'',fill:'none',stroke:T.route,'stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'});
  svg.appendChild(trailGlow);svg.appendChild(trailEl);
  projP.forEach((p,i)=>{svg.appendChild(el('circle',{cx:p[0],cy:p[1],r:5,fill:T.route,stroke:T.ivory,'stroke-width':1.4}));
    const up=i%2===0,t=el('text',{x:p[0],y:p[1]+(up?-13:24),'text-anchor':'middle'});t.setAttribute('class','lbl');t.textContent=stops[i].destination;svg.appendChild(t);});
  boatEl=el('text',{x:projP[0][0],y:projP[0][1],'text-anchor':'middle','dominant-baseline':'central','font-size':22});
  boatEl.textContent=ICON[MODE]||ICON.sea;boatEl.style.filter='drop-shadow(0 1px 4px rgba(0,0,0,.7))';svg.appendChild(boatEl);}
function setCam(cx,cy,z){const w=W/z,h=H/z;camT={w,h,x:Math.max(0,Math.min(W-w,cx-w/2)),y:Math.max(0,Math.min(H-h,cy-h/2))};}
function camLoop(){cam.x+=(camT.x-cam.x)*.06;cam.y+=(camT.y-cam.y)*.06;cam.w+=(camT.w-cam.w)*.06;cam.h+=(camT.h-cam.h)*.06;
  svg.setAttribute('viewBox',`${cam.x} ${cam.y} ${cam.w} ${cam.h}`);requestAnimationFrame(camLoop);}
const r0=n=>Math.round(n);
function renderPanel(){const l=$('stopList');l.innerHTML='';
  stops.forEach((s,i)=>{const li=document.createElement('li');li.className='stop';li.id='st'+i;
    const d=i>0?`<b>${r0(legD[i-1])} ${U}</b> · `:'';
    const nights=s.nights?`${s.nights} night${s.nights>1?'s':''}`:'departure';
    li.innerHTML=`<div class="rail"><div class="num">${i+1}</div><div class="conn"></div></div>
      <div class="body"><span class="nm">${s.destination}</span><span class="sub">${d}${nights}</span></div>`;
    l.appendChild(li);});
  $('count').textContent=r0(totalD)+' '+U;}

function loadBooking(b){MODE=b.mode||'sea';U=b.units||(MODE==='sea'?'NM':'km');stops=b.legs.map(x=>({...x}));
  resetIdle();draw();renderPanel();
  // header
  const isTMS=!!b.booking_ref;
  $('syn').classList.toggle('hide',!isTMS);
  $('tTitle').textContent=isTMS?b.client.name:(b.title||'Itinerary');
  const meta=[];if(isTMS)meta.push(b.booking_ref);if(b.vessel)meta.push(b.vessel.name);
  if(isTMS)meta.push(fmtRange(b.start_date,b.end_date),b.client.pax+' guests');else meta.push(stops.length+' stops');
  $('tMeta').textContent=meta.join('  ·  ');
  // status idle
  $('lName').textContent=stops[0].destination+' \u2192 '+stops[stops.length-1].destination;
  $('lDist').innerHTML=`${r0(totalD)} ${U}`;$('barfill').style.width='0%';
  setCam(W/2,H/2,1.0);}

function setBtn(){const m={idle:'&#9654; Play',playing:'&#10073;&#10073; Pause',paused:'&#9654; Resume',done:'&#9654; Replay'};$('playBtn').innerHTML=m[phase];}
function resetIdle(){phase='idle';cancelAnimationFrame(raf);clearTimeout(leadT);setBtn();$('here').classList.remove('show');}
function onPlay(){
  if(phase==='playing'){phase='paused';cancelAnimationFrame(raf);clearTimeout(leadT);setBtn();return;}
  if(phase==='paused'){phase='playing';setBtn();raf=requestAnimationFrame(loop);return;}
  draw();renderPanel();document.querySelectorAll('.stop').forEach(s=>s.classList.remove('active','done'));
  animI=0;animCursor=1;phase='playing';setBtn();$('here').classList.add('show');$('st0').classList.add('done');
  setCam(projP[0][0],projP[0][1],FZOOM);
  leadT=setTimeout(()=>{if(phase==='playing')raf=requestAnimationFrame(loop);},350);}
function paint(){const seg=pts.slice(0,animI+1).map(p=>p.join(',')).join(' ');trailEl.setAttribute('points',seg);trailGlow.setAttribute('points',seg);
  const c=pts[animI];boatEl.setAttribute('x',c[0]);boatEl.setAttribute('y',c[1]);setCam(c[0],c[1],FZOOM);
  const f=animI/(pts.length-1);$('barfill').style.width=(f*100)+'%';$('lDist').innerHTML=`<b>${r0(totalD*f)}</b> / ${r0(totalD)} ${U}`;}
function loop(){if(phase!=='playing')return;
  const adv=Math.max(1,Math.round(parseFloat($('speed').value)*2));animI=Math.min(animI+adv,pts.length-1);paint();
  if(animCursor<stops.length){$('lName').textContent='\u2192 '+stops[animCursor].destination;
    $('here').textContent=stops[animCursor-1].destination+' \u2192 '+stops[animCursor].destination;
    document.querySelectorAll('.stop').forEach(s=>s.classList.remove('active'));$('st'+animCursor)?.classList.add('active');}
  if(animCursor<stops.length&&animI>=legB[animCursor]){$('st'+animCursor)?.classList.add('done');$('here').textContent='Arrived · '+stops[animCursor].destination;animCursor++;}
  if(animI>=pts.length-1){phase='done';setBtn();$('lName').textContent=stops[stops.length-1].destination;
    $('barfill').style.width='100%';$('lDist').innerHTML=`<b>${r0(totalD)}</b> / ${r0(totalD)} ${U}`;$('here').textContent='Arrived · '+stops[stops.length-1].destination;setCam(W/2,H/2,1.0);return;}
  raf=requestAnimationFrame(loop);}
function repaintProgress(){for(let k=0;k<stops.length;k++){const e=$('st'+k);if(!e)continue;e.classList.remove('active','done');if(k<animCursor)e.classList.add('done');}
  if((phase==='playing'||phase==='paused')&&animCursor<stops.length)$('st'+animCursor)?.classList.add('active');if(phase!=='idle')paint();}

$('playBtn').onclick=onPlay;
$('loadTms').onclick=()=>{loadBooking(TMS_BOOKING);};
$('loadSample').onclick=()=>{loadBooking(LAND_TOUR);};
function setTheme(n,b){theme=n;document.querySelectorAll('.styletog button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  draw();renderPanel();if(phase==='idle')$('barfill').style.width='0%';else repaintProgress();}
$('s0').onclick=e=>setTheme(0,e.target);$('s1').onclick=e=>setTheme(1,e.target);$('s2').onclick=e=>setTheme(2,e.target);
$('optToggle').onclick=()=>{const o=$('opts');o.classList.toggle('open');$('optToggle').innerHTML=o.classList.contains('open')?'Options &#9652;':'Options &#9662;';};

loadBooking(TMS_BOOKING);camLoop();
</script>
</body>
</html>
